version: "3.8"

networks:
  procurepulse_net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

services:
  # ============================================================================
  # 1. PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: procurepulse_db
    restart: unless-stopped
    networks:
      - procurepulse_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zycus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zycus_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-procurepulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zycus_user} -d ${POSTGRES_DB:-procurepulse}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 2. FastAPI Requisition Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procurepulse_app
    restart: unless-stopped
    networks:
      - procurepulse_net
    environment:
      APP_NAME: "ZycusProcurePulse"
      APP_ENV: "production"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-zycus_user}:${POSTGRES_PASSWORD:-zycus_secure_pass_2026}@db:5432/${POSTGRES_DB:-procurepulse}"
      CHAOS_ENABLED: "true"
      METRICS_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 3. Nginx Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: procurepulse_nginx
    restart: unless-stopped
    networks:
      - procurepulse_net
    ports:
      - "80:80"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # ============================================================================
  # 4. Prometheus Monitoring & Alert Engine
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: procurepulse_prometheus
    restart: unless-stopped
    networks:
      - procurepulse_net
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"

  # ============================================================================
  # 5. Alertmanager Notification Router
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: procurepulse_alertmanager
    restart: unless-stopped
    networks:
      - procurepulse_net
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # ============================================================================
  # 6. Grafana Visual Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: procurepulse_grafana
    restart: unless-stopped
    networks:
      - procurepulse_net
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ============================================================================
  # 7. Blackbox Exporter (Synthetic Probes)
  # ============================================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: procurepulse_blackbox
    restart: unless-stopped
    networks:
      - procurepulse_net
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/config/blackbox.yml:ro
    command:
      - "--config.file=/config/blackbox.yml"

  # ============================================================================
  # 8. Node Exporter (Host Metrics)
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: procurepulse_node_exporter
    restart: unless-stopped
    networks:
      - procurepulse_net
    ports:
      - "9100:9100"

  # ============================================================================
  # 9. Alert Sink (Live Webhook Inspector)
  # ============================================================================
  alert-sink:
    build:
      context: ./monitoring/alert_sink
      dockerfile: Dockerfile
    container_name: procurepulse_alert_sink
    restart: unless-stopped
    networks:
      - procurepulse_net
    ports:
      - "9999:9999"
