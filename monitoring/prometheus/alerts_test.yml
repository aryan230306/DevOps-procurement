# Promtool unit test suite validating Prometheus alert rules and PromQL logic
rule_files:
  - recording_rules.yml
  - alert_rules.yml

evaluation_interval: 1m

tests:
  # -----------------------------------------------------
  # Test Case 1: High Error Rate Triggers Critical Page Alert
  # -----------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", endpoint="/api/v1/requisitions/", status_code="500"}'
        values: '0+100x120'
      - series: 'http_requests_total{method="GET", endpoint="/api/v1/requisitions/", status_code="200"}'
        values: '0+100x120'
    alert_rule_test:
      - eval_time: 5m
        alertname: ProcurePulseErrorBudgetBurnRateCritical
        exp_alerts:
          - exp_labels:
              severity: page
              service: procurepulse
              slo: availability
            exp_annotations:
              summary: "CRITICAL: ProcurePulse 14.4x Error Budget Burn Rate Detected"

  # -----------------------------------------------------
  # Test Case 2: Synthetic Blackbox Probe Failure
  # -----------------------------------------------------
  - interval: 30s
    input_series:
      - series: 'probe_success{instance="http://nginx:80/healthz"}'
        values: '0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: ProcurePulseSyntheticProbeFailed
        exp_alerts:
          - exp_labels:
              severity: page
              service: blackbox
              instance: "http://nginx:80/healthz"
            exp_annotations:
              summary: "Blackbox Synthetic HTTP Probe Failed"
