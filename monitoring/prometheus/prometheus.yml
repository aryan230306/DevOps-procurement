global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "/etc/prometheus/recording_rules.yml"
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # Main FastAPI Procurement Service Scrape
  - job_name: "procurepulse-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "procurepulse"
          tier: "backend"
          env: "production"

  # Nginx Reverse Proxy
  - job_name: "nginx"
    metrics_path: "/nginx_status"
    static_configs:
      - targets: ["nginx:80"]
        labels:
          service: "nginx"
          tier: "proxy"

  # Blackbox Synthetic Probes
  - job_name: "blackbox-http"
    metrics_path: "/probe"
    params:
      module: ["http_2xx"]
    static_configs:
      - targets:
          - "http://nginx:80/healthz"
          - "http://nginx:80/readyz"
          - "http://nginx:80/api/v1/requisitions/"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  # Node Exporter Host Metrics
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          tier: "infrastructure"

  # Alertmanager Internal Metrics
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
